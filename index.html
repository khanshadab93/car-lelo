<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarLelo - India Car Recommendation Engine</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white font-extrabold text-xl px-3 py-1.5 rounded-xl shadow-lg shadow-indigo-600/30">CL</div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">CarLelo</h1>
                    <p class="text-xs text-slate-400">Find your ideal car in India</p>
                </div>
            </div>
            <div class="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-full border border-slate-700 font-medium">
                🇮🇳 Verified 2026 Indian Market Database
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Requirement Filters -->
        <section class="lg:col-span-5 bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl backdrop-blur-sm self-start sticky top-24">
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
                <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
                    Your Requirements
                </h2>
                <button onclick="resetForm()" class="text-xs text-slate-400 hover:text-indigo-400 transition">Reset All</button>
            </div>

            <form id="carForm" onsubmit="event.preventDefault(); findCars();" class="space-y-6">
                
                <!-- Budget Slider -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-semibold text-slate-300">Max Budget</label>
                        <span id="budgetValue" class="text-indigo-400 font-bold text-sm bg-indigo-950/60 px-2.5 py-1 rounded-lg border border-indigo-800/50">₹ 25 Lakhs</span>
                    </div>
                    <input type="range" id="budget" min="3" max="100" step="0.5" value="25" oninput="updateBudgetLabel(this.value)" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    <div class="flex justify-between text-[10px] text-slate-500 mt-1">
                        <span>₹3 Lakhs</span>
                        <span>₹50 Lakhs</span>
                        <span>₹1 Crore+</span>
                    </div>
                </div>

                <!-- Body Type -->
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Preferred Body Type</label>
                    <select id="bodyType" onchange="findCars()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                        <option value="All">Any Body Type</option>
                        <option value="Hatchback">Hatchback</option>
                        <option value="Compact SUV">Compact SUV</option>
                        <option value="SUV">Full SUV</option>
                        <option value="Sedan">Sedan</option>
                        <option value="MPV">MPV / 7-Seater</option>
                    </select>
                </div>

                <!-- Fuel Type -->
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Fuel / Power Type</label>
                    <select id="fuelType" onchange="findCars()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                        <option value="All">Any Fuel Type</option>
                        <option value="Petrol">Petrol</option>
                        <option value="Diesel">Diesel</option>
                        <option value="EV">Electric (EV)</option>
                        <option value="Hybrid">Hybrid</option>
                        <option value="CNG">CNG</option>
                    </select>
                </div>

                <!-- Transmission -->
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Transmission</label>
                    <select id="transmission" onchange="findCars()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                        <option value="All">Any Transmission</option>
                        <option value="Automatic">Automatic</option>
                        <option value="Manual">Manual</option>
                    </select>
                </div>

                <!-- Seating Capacity -->
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Minimum Seating Capacity</label>
                    <select id="seating" onchange="findCars()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                        <option value="0">Any Seating</option>
                        <option value="5">5 Seater</option>
                        <option value="6">6 or 7 Seater</option>
                    </select>
                </div>

                <!-- Features Checkboxes -->
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Must-Have Features</label>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <label class="flex items-center space-x-2 bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/60 cursor-pointer hover:border-indigo-500/50 transition">
                            <input type="checkbox" name="feature" value="Sunroof" onchange="findCars()" class="accent-indigo-500 rounded">
                            <span class="text-slate-300">Sunroof</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/60 cursor-pointer hover:border-indigo-500/50 transition">
                            <input type="checkbox" name="feature" value="ADAS" onchange="findCars()" class="accent-indigo-500 rounded">
                            <span class="text-slate-300">ADAS Safety</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/60 cursor-pointer hover:border-indigo-500/50 transition">
                            <input type="checkbox" name="feature" value="Ventilated Seats" onchange="findCars()" class="accent-indigo-500 rounded">
                            <span class="text-slate-300">Ventilated Seats</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/60 cursor-pointer hover:border-indigo-500/50 transition">
                            <input type="checkbox" name="feature" value="360 Camera" onchange="findCars()" class="accent-indigo-500 rounded">
                            <span class="text-slate-300">360° Camera</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/60 cursor-pointer hover:border-indigo-500/50 transition">
                            <input type="checkbox" name="feature" value="Connected Tech" onchange="findCars()" class="accent-indigo-500 rounded">
                            <span class="text-slate-300">Connected Tech</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/60 cursor-pointer hover:border-indigo-500/50 transition">
                            <input type="checkbox" name="feature" value="Cruise Control" onchange="findCars()" class="accent-indigo-500 rounded">
                            <span class="text-slate-300">Cruise Control</span>
                        </label>
                    </div>
                </div>

            </form>
        </section>

        <!-- Right Column: Recommendation Results -->
        <section class="lg:col-span-7 flex flex-col space-y-4">
            <div class="flex justify-between items-center bg-slate-900/60 border border-slate-800 px-6 py-4 rounded-2xl backdrop-blur-sm">
                <div id="resultsCount" class="text-sm font-semibold text-slate-300">Showing cars...</div>
                <div class="flex items-center space-x-2">
                    <span class="text-xs text-slate-400">Sort by:</span>
                    <select id="sortBy" onchange="findCars()" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none">
                        <option value="match">Best Match</option>
                        <option value="price-asc">Price: Low to High</option>
                        <option value="price-desc">Price: High to Low</option>
                        <option value="mileage">Highest Mileage</option>
                    </select>
                </div>
            </div>

            <div id="carList" class="space-y-4">
                <!-- Dynamically filled car cards -->
            </div>
        </section>

    </main>

    <footer class="border-t border-slate-800 py-6 mt-12 text-center text-xs text-slate-500">
        CarLelo India • Accurate 2026 Ex-Showroom Market Database

            { name: "Kia Carens", brand: "Kia", price: 10.52, maxPrice: 19.67, body: "MPV", fuel: ["Petrol", "Diesel"], transmission: ["Manual", "Automatic"], seats: 7, mileage: "16.5 kmpl", safety: "3-Star", features: ["Sunroof", "Ventilated Seats", "Connected Tech", "Cruise Control"], image: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=600&q=80" },
            { name: "Toyota Innova Hycross", brand: "Toyota", price: 19.77, maxPrice: 30.98, body: "MPV", fuel: ["Petrol", "Hybrid"], transmission: ["Automatic"], seats: 7, mileage: "23.2 kmpl", safety: "5-Star", features: ["Sunroof", "ADAS", "Ventilated Seats", "Connected Tech", "Cruise Control"], image: "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=600&q=80" }
        ];

        function updateBudgetLabel(val) {
            document.getElementById('budgetValue').innerText = `₹ ${val} Lakhs`;
            findCars();
        }

        function resetForm() {
            document.getElementById('carForm').reset();
            document.getElementById('budget').value = 25;
            document.getElementById('budgetValue').innerText = '₹ 25 Lakhs';
            findCars();
        }

        function findCars() {
            const maxBudget = parseFloat(document.getElementById('budget').value);
            const bodyType = document.getElementById('bodyType').value;
            const fuelType = document.getElementById('fuelType').value;
            const transmission = document.getElementById('transmission').value;
            const minSeating = parseInt(document.getElementById('seating').value);
            const sortBy = document.getElementById('sortBy').value;

            const selectedFeatures = Array.from(document.querySelectorAll('input[name="feature"]:checked')).map(cb => cb.value);

            // STRICT FILTERING LOGIC
            let filteredCars = carDatabase.filter(car => {
                // 1. Strict Budget Filter
                if (car.price > maxBudget) return false;

                // 2. Strict Body Type Filter
                if (bodyType !== 'All' && car.body !== bodyType) return false;

                // 3. Strict Fuel Type Filter
                if (fuelType !== 'All' && !car.fuel.includes(fuelType)) return false;

                // 4. Strict Transmission Filter
                if (transmission !== 'All' && !car.transmission.includes(transmission)) return false;

                // 5. Strict Seating Filter
                if (minSeating > 0 && car.seats < minSeating) return false;

                return true;
            });

            // SCORE COMPUTATION FOR MATCH PERCENTAGE
            let scoredCars = filteredCars.map(car => {
                let matchedFeaturesCount = 0;
                selectedFeatures.forEach(feat => {
                    if (car.features.includes(feat)) matchedFeaturesCount++;
                });

                let matchPercentage = 100;
                if (selectedFeatures.length > 0) {
                    matchPercentage = Math.round(70 + (matchedFeaturesCount / selectedFeatures.length) * 30);
                }

                return { ...car, matchPercentage, matchedFeaturesCount };
            });

            // SORTING LOGIC
            if (sortBy === 'match') {
                scoredCars.sort((a, b) => b.matchPercentage - a.matchPercentage || a.price - b.price);
            } else if (sortBy === 'price-asc') {
                scoredCars.sort((a, b) => a.price - b.price);
            } else if (sortBy === 'price-desc') {
                scoredCars.sort((a, b) => b.price - a.price);
            } else if (sortBy === 'mileage') {
                scoredCars.sort((a, b) => parseFloat(b.mileage) - parseFloat(a.mileage));
            }

            renderCars(scoredCars);
        }

        function renderCars(cars) {
            const container = document.getElementById('carList');
            document.getElementById('resultsCount').innerText = `Showing ${cars.length} matching car(s)`;

            if (cars.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-10 text-center text-slate-400">
                        <p class="text-base font-semibold mb-1">No cars found matching your selected filters.</p>
                        <p class="text-xs">Try increasing your budget slider or clearing your specific body/fuel filter selection.</p>
                    </div>`;
                return;
            }

            container.innerHTML = cars.map(car => `
                <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-5 hover:border-indigo-500/50 transition duration-300 flex flex-col sm:flex-row gap-5 shadow-lg backdrop-blur-sm">
                    <div class="sm:w-48 h-36 bg-slate-800 rounded-xl overflow-hidden relative flex-shrink-0">
                        <img src="${car.image}" alt="${car.name}" class="w-full h-full object-cover">
                        <div class="absolute top-2 left-2 bg-indigo-600/90 backdrop-blur-md text-white text-[10px] font-bold px-2.5 py-1 rounded-lg">
                            ${car.matchPercentage}% Match
                        </div>
                    </div>
                    <div class="flex-grow flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start">
                                <div>
                                    <span class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">${car.brand}</span>
                                    <h3 class="text-lg font-bold text-slate-100">${car.name}</h3>
                                </div>
                                <div class="text-right">
                                    <div class="text-lg font-extrabold text-slate-100">₹ ${car.price} - ${car.maxPrice} L</div>
                                    <div class="text-[10px] text-slate-400">Ex-Showroom India</div>
                                </div>
                            </div>
                            <div class="flex flex-wrap gap-2 mt-3 text-xs">
                                <span class="bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700/60">${car.body}</span>
                                <span class="bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700/60">${car.fuel.join(' / ')}</span>
                                <span class="bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700/60">${car.transmission.join(' / ')}</span>
                                <span class="bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700/60">${car.seats} Seater</span>
                                <span class="bg-slate-800 text-cyan-400 px-2.5 py-1 rounded-lg border border-cyan-900/40">⛽ ${car.mileage}</span>
                                <span class="bg-slate-800 text-amber-400 px-2.5 py-1 rounded-lg border border-amber-900/40">🛡️ ${car.safety}</span>
                            </div>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-800/80 flex flex-wrap gap-1.5 items-center">
                            <span class="text-[11px] text-slate-400 font-medium mr-1">Key Features:</span>
                            ${car.features.length > 0 ? car.features.map(f => `<span class="text-[10px] bg-indigo-950/80 text-indigo-300 px-2 py-0.5 rounded border border-indigo-800/40">${f}</span>`).join('') : '<span class="text-[10px] text-slate-500">Standard features</span>'}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Initial load
        window.onload = findCars;
    </script>
</body>
</html>
