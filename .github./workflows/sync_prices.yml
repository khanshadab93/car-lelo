name: Weekly Automotive Data Sync

on:
  schedule:
    # Runs every Sunday at midnight UTC (5:30 AM IST Monday)
    - cron: '0 0 * * 0'
  
  # This lets you run the script manually from the GitHub website anytime
  workflow_dispatch:

# CRITICAL: This gives the workflow permission to commit changes back to your repo
permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: |
          python scripts/update_prices.py

      - name: Commit and Push Updated cars.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update car prices via GitHub Actions cron"
          file_pattern: 'cars.json'
